<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#A5D6A7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="250" r="180" fill="#ffffff" opacity="0.03"/>
  <circle cx="1100" cy="50" r="140" fill="#ffffff" opacity="0.03"/>
  <circle cx="600" cy="300" r="200" fill="#ffffff" opacity="0.02"/>
  <!-- Islamic geometric pattern hint -->
  <path d="M 50 150 L 100 100 L 150 150 L 100 200 Z" fill="none" stroke="#81C784" stroke-width="0.5" opacity="0.2"/>
  <path d="M 1050 50 L 1100 0 L 1150 50 L 1100 100 Z" fill="none" stroke="#81C784" stroke-width="0.5" opacity="0.2"/>
  <!-- Accent line -->
  <rect x="0" y="260" width="1200" height="4" fill="url(#accent)" opacity="0.6"/>
  <!-- Main Title -->
  <text x="600" y="130" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    Yayasan Amal Shalih Insan Bantul
  </text>
  <!-- Subtitle -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="20" fill="#A5D6A7" text-anchor="middle" letter-spacing="6">
    MENEBAR KEBAIKAN · MEMBANGUN PERADABAN
  </text>
  <!-- Description -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle">
    Pendidikan · Sosial · Dakwah
  </text>
  <!-- Bottom line -->
  <rect x="480" y="245" width="240" height="2" fill="#81C784" opacity="0.8" rx="1"/>
  <!-- Decorative dots -->
  <circle cx="588" cy="245" r="3" fill="#A5D6A7" opacity="0.6"/>
  <circle cx="600" cy="245" r="3" fill="#A5D6A7" opacity="0.8"/>
  <circle cx="612" cy="245" r="3" fill="#A5D6A7" opacity="0.6"/>
</svg>
